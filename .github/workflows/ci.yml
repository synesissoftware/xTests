#
# Created: 30th July 2026
# Updated: 20th September 2026
#
# TEMPORARY: this workflow is reduced to a language×toolchain build survey
# for the README Compatibility matrix. Normal cell / install-smoke /
# stlsoft-routes jobs are disabled until the survey is complete, then this
# file should be restored to the modular Synesis layout.
#

name: CI

on:
  push:
    branches:
      - master
      - dev
      - boilerplate
      - idiomatic
      - rc1
      - rc2
      - rc3
      - compiler-language-matrix
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  # Temporary Compatibility matrix survey (configure + build only).
  # continue-on-error so expected ❌ cells do not hide sibling results.
  # Job count: 5 toolchains × 19 language pairs = 95.
  compat:
    name: Compat (${{ matrix.tc.id }}, C++${{ matrix.cxx }}/C${{ matrix.c }})
    runs-on: ${{ matrix.tc.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        tc:
          - id: linux-clang
            os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            toolchain: ''
          - id: linux-gcc
            os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            toolchain: ''
          - id: macos-clang
            os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            toolchain: ''
          - id: windows-cl
            os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            toolchain: ''
          - id: windows-mingw
            os: windows-latest
            c_compiler: gcc
            cpp_compiler: g++
            toolchain: mingw
        cxx:
          - 23
          - 20
          - 17
          - 14
          - 11
          - 98
        c:
          - 23
          - 17
          - 11
          - 99
          - 90
        exclude:
          # Keep only the README Compatibility table pairs (19 of 30).
          - cxx: 23
            c: 11
          - cxx: 23
            c: 99
          - cxx: 23
            c: 90
          - cxx: 17
            c: 23
          - cxx: 14
            c: 23
          - cxx: 14
            c: 17
          - cxx: 11
            c: 23
          - cxx: 11
            c: 17
          - cxx: 98
            c: 23
          - cxx: 98
            c: 17
          - cxx: 98
            c: 11

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang (Ubuntu)
        if: runner.os == 'Linux' && matrix.tc.c_compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Setup MSYS2 MinGW
        if: runner.os == 'Windows' && matrix.tc.toolchain == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make

      - name: Install STLSoft dependency
        uses: ./.github/actions/install-sis-deps
        with:
          build-type: ${{ env.BUILD_TYPE }}
          c-compiler: ${{ matrix.tc.c_compiler }}
          cpp-compiler: ${{ matrix.tc.cpp_compiler }}
          dependencies: STLSoft
          toolchain: ${{ matrix.tc.toolchain }}

      # TEMPORARY: until these STLSoft fixes ship in a published release,
      # patch the installed headers so survey cells are meaningful. Remove
      # when SIS deps include both: (1) MinGW C++23 gmtime_r discrimination;
      # (2) C90-safe STLSOFT_CUSTOM_C_INLINE (static, not extern inline).
      - name: Patch installed STLSoft for compat survey
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${{ env.SIS_DEPS }}" <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])

          # --- (1) MinGW C++23 time discrimination ---
          time_h = root / "include/stlsoft/api/external/time.h"
          text = time_h.read_text()
          needle = (
              "# ifndef _MSC_VER\n"
              "#  define STLSOFT_LF_SUPPORT_STD_gmtime_r\n"
              "#  define STLSOFT_LF_SUPPORT_STD_localtime_r\n"
              "# endif"
          )
          repl = (
              "# if !defined(_MSC_VER) && \\\n"
              "     !defined(__MINGW32__) && \\\n"
              "     !defined(__MINGW64__)\n"
              "#  define STLSOFT_LF_SUPPORT_STD_gmtime_r\n"
              "#  define STLSOFT_LF_SUPPORT_STD_localtime_r\n"
              "# endif"
          )
          if needle in text:
              time_h.write_text(text.replace(needle, repl, 1))
              print("patched", time_h)
          elif "__MINGW64__" in text and "STLSOFT_LF_SUPPORT_STD_gmtime_r" in text:
              print("STLSoft time.h already looks patched; leaving as-is")
          else:
              raise SystemExit(
                  "expected MinGW C++23 discrimination block not found in "
                  + str(time_h)
              )

          # --- (2) C90-safe CUSTOM_C_INLINE in clang/gcc cccap ---
          inline_needle = (
              "# if defined(__STDC_VERSION__) &&\\\n"
              "     __STDC_VERSION__ >= 201112L\n"
              "\n"
              "#  define STLSOFT_CUSTOM_C_INLINE"
              "                           static inline\n"
              "# else /* ? C version */\n"
              "\n"
              "#  define STLSOFT_CUSTOM_C_INLINE"
              "                           extern inline\n"
              "# endif /* C version */\n"
          )
          inline_repl = (
              "# if defined(__STDC_VERSION__) &&\\\n"
              "     __STDC_VERSION__ >= 199901L\n"
              "\n"
              "#  define STLSOFT_CUSTOM_C_INLINE"
              "                           static inline\n"
              "# else /* ? C version */\n"
              "\n"
              "#  define STLSOFT_CUSTOM_C_INLINE"
              "                           static __attribute__((unused))\n"
              "# endif /* C version */\n"
          )
          for name in ("clang.h", "gcc.h"):
              path = root / "include/stlsoft/internal/cccap" / name
              text = path.read_text()
              if inline_needle in text:
                  path.write_text(text.replace(inline_needle, inline_repl, 1))
                  print("patched", path)
              elif (
                  "STLSOFT_CUSTOM_C_INLINE" in text
                  and "__STDC_VERSION__ >= 199901L" in text
                  and "extern inline" not in text
                  and "__attribute__((unused))" in text
              ):
                  print(name, "already looks C90-safe; leaving as-is")
              else:
                  raise SystemExit(
                      "expected CUSTOM_C_INLINE block not found in " + str(path)
                  )
          PY

      - name: Configure and build (prepare_cmake.sh)
        if: matrix.tc.c_compiler != 'cl'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.tc.toolchain }}" = "mingw" ]; then
            export PATH="/mingw64/bin:$PATH"
          fi
          export CC="${{ matrix.tc.c_compiler }}"
          export CXX="${{ matrix.tc.cpp_compiler }}"
          export CMAKE_PREFIX_PATH="${{ env.SIS_DEPS }}"
          export SIS_CMAKE_BUILD_DIR="${{ github.workspace }}/build"
          PREPARE_ARGS=(
            --c-standard "${{ matrix.c }}"
            --cxx-standard "${{ matrix.cxx }}"
            --no-shwild
            --run-make
          )
          if [ "${{ matrix.tc.toolchain }}" = "mingw" ]; then
            PREPARE_ARGS+=(--mingw)
          fi
          echo "Survey cell: ${{ matrix.tc.id }} C++${{ matrix.cxx }}/C${{ matrix.c }}"
          ./prepare_cmake.sh "${PREPARE_ARGS[@]}"

      - name: Configure and build (MSVC / cl)
        if: matrix.tc.c_compiler == 'cl'
        shell: bash
        run: |
          set -euo pipefail
          echo "Survey cell: ${{ matrix.tc.id }} C++${{ matrix.cxx }}/C${{ matrix.c }}"
          cmake -B build -S . \
            -DCMAKE_DISABLE_FIND_PACKAGE_MFC=TRUE \
            -DCMAKE_PREFIX_PATH="${{ env.SIS_DEPS }}" \
            -DCMAKE_C_STANDARD="${{ matrix.c }}" \
            -DCMAKE_CXX_STANDARD="${{ matrix.cxx }}" \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_TESTING=ON \
            -DNO_SHWILD=ON
          cmake --build build --config "${{ env.BUILD_TYPE }}" --parallel
